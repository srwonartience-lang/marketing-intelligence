name: Daily Marketing Intelligence Pipeline

on:
  schedule:
    # 매일 UTC 20:17 = KST 05:17. 사용자가 출근해 화면을 보는 오전 9시 전에
    # 수집·분류·대시보드 생성이 모두 끝나 있어야 한다.
    #
    # 정각(:00)을 피한 이유: GitHub의 예약 실행은 정각에 몰려서 크게 밀린다.
    # KST 06:00(0 21 * * *)으로 걸었을 때 실제 시작은 07:58~08:40이었고,
    # 실행 자체는 1~2분이라 나머지 2시간 남짓이 전부 대기열 지연이었다.
    # 9월 15일은 08:40에 끝나 9시까지 여유가 20분뿐이었다. 붐비지 않는 17분으로
    # 옮기고 한 시간 당겨, 같은 수준으로 밀려도 8시 전에 끝나게 한다.
    - cron: "17 20 * * *"
  workflow_dispatch: {} # Actions 탭에서 수동 실행 버튼 지원

jobs:
  collect:
    runs-on: ubuntu-latest
    # 생성된 docs/index.html을 저장소에 커밋해야 GitHub Pages가 갱신된다.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RSS collector
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python main.py

      - name: Run event clustering
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python cluster_events.py

      - name: Run rule-based classification
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python classify_content.py

      - name: Run platform tagging
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python classify_platforms.py

      - name: Generate dashboard
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python generate_dashboard.py

      - name: Commit dashboard
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "docs/index.html unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Update dashboard for $(date -u +%Y-%m-%d)"
          git push

      - name: Upload collector log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-log
          path: logs/collector.log
