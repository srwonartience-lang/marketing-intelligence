name: Daily Marketing Intelligence Pipeline

on:
  schedule:
    - cron: "0 0 * * *" # 매일 UTC 00:00 = KST 09:00
  workflow_dispatch: {} # Actions 탭에서 수동 실행 버튼 지원

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RSS collector
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python main.py

      - name: Run event clustering
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python cluster_events.py

      - name: Run rule-based classification
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python classify_content.py

      - name: Upload collector log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-log
          path: logs/collector.log
