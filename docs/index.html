<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000;
    --on-primary:#ffffff;
    --canvas:#ffffff;
    --canvas-dark:#010120;
    --hairline:#ebebeb;
    --hairline-on-dark:#26263a;
    --surface-soft:#f7f7f8;
    /* 기존 #8f8f8f는 흰 배경 대비 2.9:1로 WCAG AA(4.5:1) 미달이었다. */
    --body:#6b6b6b;
    --on-dark:#ffffff;
    --on-dark-soft:#a6a6c2;

    /* 액션 등급. 화면에서 가장 강한 컬러는 '조치 필요' 하나만 쓴다. */
    --action:#c33d02;
    --action-wash:#fdefe8;
    --action-vivid:#fc4c02;
    --headsup:#7a5200;
    --headsup-wash:#fbf2dc;
    /* mint는 '확인 완료 / 변경 없음' 성공 상태 전용으로 재배정했다. */
    --done:#0e6e67;
    --done-wash:#c8f6f9;
    --done-wash-soft:#e4f7f8;

    --r-xs:3.25px;
    --r-sm:4px;
    --r-md:8px;
    --r-full:9999px;

    --cat-geo:#5B4FC7;        --cat-geo-wash:#EEEBFB;
    --cat-ai:#1D6FB8;         --cat-ai-wash:#E4EFF8;
    --cat-industry:#4B5566;   --cat-industry-wash:#EDEEF0;
    --cat-perf:#B5490C;       --cat-perf-wash:#FBEBE0;
    --cat-commerce:#0E7A72;   --cat-commerce-wash:#E2F3F1;
    --cat-brand:#A6238C;      --cat-brand-wash:#F8E7F4;
    --cat-research:#2F7D4F;   --cat-research-wash:#E5F3EA;
  }

  *{box-sizing:border-box;}
  html, body{ margin:0; padding:0; }
  body{
    background:var(--canvas);
    color:var(--ink);
    font-family:"Inter", Helvetica Neue, Arial, sans-serif;
    font-feature-settings:"ss01";
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1120px; margin:0 auto; }

  .disp-xl{ font-size:40px; font-weight:500; line-height:48px; letter-spacing:-0.8px; text-wrap:balance; margin:0; }
  .disp-lg{ font-size:26px; font-weight:500; line-height:31px; letter-spacing:-0.4px; margin:0; }
  .disp-md{ font-size:19px; font-weight:500; line-height:24px; letter-spacing:-0.2px; margin:0; text-wrap:balance; }
  .body-md{ font-size:16px; font-weight:400; line-height:22px; letter-spacing:-0.16px; }
  .body-md-strong{ font-size:16px; font-weight:500; line-height:22px; letter-spacing:-0.16px; }
  .body-sm{ font-size:14px; font-weight:400; line-height:20px; letter-spacing:-0.1px; }
  .caption{ font-size:13px; font-weight:400; line-height:18px; color:var(--body); }
  .mono-btn{ font-family:"JetBrains Mono",ui-monospace,monospace; font-size:13px; font-weight:500; letter-spacing:0.04em; text-transform:uppercase; }
  .mono-eyebrow{ font-family:"JetBrains Mono",ui-monospace,monospace; font-size:11px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; }
  .mono-caption{ font-family:"JetBrains Mono",ui-monospace,monospace; font-size:11px; font-weight:400; letter-spacing:0.04em; font-variant-numeric:tabular-nums; }

  /* ---------- 상단 바: 64px 단일 행 ---------- */
  .topbar{ background:var(--canvas-dark); color:var(--on-dark); }
  .topbar-inner{
    max-width:1120px; margin:0 auto; height:64px; padding:0 32px;
    display:flex; align-items:center; gap:16px;
  }
  .topbar .brand{ font-size:17px; font-weight:500; letter-spacing:-0.3px; color:var(--on-dark); }
  .topbar .brand .mark{ color:var(--action-vivid); }
  .topbar .today{ color:var(--on-dark-soft); margin-left:4px; }
  .topbar .spacer{ flex:1; }
  .topbar .fresh{ color:var(--on-dark-soft); display:flex; align-items:center; gap:7px; }
  .topbar .fresh .dot{ width:6px; height:6px; border-radius:50%; background:var(--done-wash); flex:none; }
  .topbar .fresh.stale .dot{ background:var(--action-vivid); }

  /* ---------- 탭 ---------- */
  .tabbar{ margin:20px 32px 0; display:inline-flex; background:var(--hairline); border-radius:var(--r-sm); padding:4px; gap:4px; }
  .tabbar button{ appearance:none; border:none; cursor:pointer; background:var(--canvas); color:var(--ink); border-radius:var(--r-sm); padding:8px 20px; display:inline-flex; align-items:center; gap:7px; flex:none; white-space:nowrap; }
  .tabbar button:not(.active){ background:transparent; color:var(--body); }
  .tabbar button.active{ background:var(--ink); color:var(--on-primary); }
  .tabbar button:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .tabbar .tab-count{
    font-family:"JetBrains Mono",monospace; font-size:10px; font-weight:500;
    background:var(--action-vivid); color:#fff; border-radius:var(--r-full);
    min-width:16px; height:16px; padding:0 4px; display:inline-flex; align-items:center; justify-content:center;
  }
  .tabbar button.active .tab-count{ background:var(--action-vivid); }
  .tabbar .tab-count:empty, .tabbar .tab-count[hidden]{ display:none; }

  .content{ padding:20px 32px 72px; }
  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- 판정 한 줄 ---------- */
  .verdict{
    border:1px solid var(--hairline); border-left:3px solid var(--ink);
    border-radius:var(--r-sm); padding:16px 20px; margin-bottom:12px;
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  }
  .verdict.has-action{ border-left-color:var(--action-vivid); background:var(--action-wash); border-color:#f4d9cc; }
  .verdict.all-clear{ border-left-color:var(--done); background:var(--done-wash-soft); border-color:#c2e9eb; }
  .verdict .v-main{ font-size:19px; font-weight:500; letter-spacing:-0.2px; margin:0; }
  .verdict.has-action .v-main{ color:var(--action); }
  .verdict.all-clear .v-main{ color:var(--done); }
  .verdict .v-sub{ color:var(--body); }

  /* ---------- 내 채널 상태 행 ---------- */
  .status-row{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:8px; margin-bottom:20px;
  }
  .ch{
    appearance:none; font-family:inherit; text-align:left; cursor:pointer;
    background:var(--canvas); border:1px solid var(--hairline); border-radius:var(--r-sm);
    padding:12px 14px; display:flex; flex-direction:column; gap:2px;
    transition:border-color 0.12s ease;
  }
  .ch:hover{ border-color:var(--ink); }
  .ch:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .ch .ch-name{ font-size:13px; font-weight:500; letter-spacing:-0.1px; }
  .ch .ch-state{ display:flex; align-items:baseline; gap:6px; }
  .ch .ch-n{ font-size:22px; font-weight:500; letter-spacing:-0.4px; font-variant-numeric:tabular-nums; line-height:1.2; }
  .ch .ch-unit{ color:var(--body); font-size:11px; }
  .ch.zero .ch-n{ color:var(--body); }
  .ch.zero .ch-name{ color:var(--body); }
  .ch.has-action{ border-color:var(--action-vivid); background:var(--action-wash); }
  .ch.has-action .ch-n{ color:var(--action); }
  .ch.has-action .ch-name{ color:var(--action); }
  .ch.selected{ border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }

  /* ---------- 섹션 ---------- */
  .sec{ margin-bottom:22px; }
  .sec-head{ display:flex; align-items:baseline; gap:4px 10px; flex-wrap:wrap; margin-bottom:10px; }
  .sec-head .sec-desc{ color:var(--body); }
  .sec-head .sec-label{ color:var(--ink); }
  .sec-head .sec-n{ color:var(--body); }
  .sec-head.action .sec-label{ color:var(--action); }

  /* ---------- 카드 ---------- */
  .list{ display:flex; flex-direction:column; gap:10px; }
  .card{
    background:var(--canvas); border:1px solid var(--hairline); border-radius:var(--r-sm);
    padding:16px 18px; border-left:3px solid var(--hairline);
  }
  .card.tier-action{ border-left-color:var(--action-vivid); }
  .card.tier-heads_up{ border-left-color:var(--headsup); }
  .card .row-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; flex-wrap:wrap; }
  .card .tags{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .card h3{ font-size:17px; font-weight:500; line-height:23px; letter-spacing:-0.2px; margin:0 0 6px; text-wrap:balance; }
  .card p{ margin:0 0 12px; color:var(--ink); max-width:70ch; }
  .row-meta{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .sources{ display:flex; gap:6px; flex-wrap:wrap; }
  .sources .badge{ color:var(--body); }

  /* ---------- 배지 ---------- */
  .badge{ display:inline-flex; align-items:center; background:var(--canvas); color:var(--ink); border:1px solid var(--hairline); border-radius:var(--r-sm); padding:2px 8px; }
  .badge-outline{ background:transparent; }
  .badge-plat{ font-family:"JetBrains Mono",monospace; font-size:10.5px; font-weight:500; letter-spacing:0.03em; border-color:#cfcfcf; color:var(--ink); }
  .badge-official{ background:var(--ink); color:var(--on-primary); border-color:var(--ink); }
  .badge-new{ background:var(--action-vivid); color:#fff; border-color:var(--action-vivid); }
  .badge-tier-action{ background:var(--action-wash); color:var(--action); border-color:#f0cdbc; }
  .badge-tier-heads_up{ background:var(--headsup-wash); color:var(--headsup); border-color:#eadfbe; }
  .badge-done{ background:var(--done-wash); color:var(--done); border-color:#a9e9ec; }

  .chip{ border:none; }
  .chip-geo{ background:var(--cat-geo-wash); color:var(--cat-geo); }
  .chip-ai{ background:var(--cat-ai-wash); color:var(--cat-ai); }
  .chip-industry{ background:var(--cat-industry-wash); color:var(--cat-industry); }
  .chip-perf{ background:var(--cat-perf-wash); color:var(--cat-perf); }
  .chip-commerce{ background:var(--cat-commerce-wash); color:var(--cat-commerce); }
  .chip-brand{ background:var(--cat-brand-wash); color:var(--cat-brand); }
  .chip-research{ background:var(--cat-research-wash); color:var(--cat-research); }

  a{ color:inherit; text-decoration:none; }
  a.badge{ cursor:pointer; }
  a.badge:hover{ border-color:var(--ink); }
  .card h3 a, .tl-card h4 a{ cursor:pointer; }
  .card h3 a:hover, .tl-card h4 a:hover{ text-decoration:underline; text-underline-offset:3px; }

  /* ---------- 알아둘 것: 한 줄 목록 ---------- */
  .oneline{ display:flex; flex-direction:column; border:1px solid var(--hairline); border-radius:var(--r-sm); overflow:hidden; }
  .oneline a{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    border-bottom:1px solid var(--hairline); cursor:pointer;
  }
  .oneline a:last-child{ border-bottom:none; }
  .oneline a:hover{ background:var(--surface-soft); }
  .oneline .ol-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .oneline .ol-right{ display:flex; align-items:center; gap:6px; flex:none; }

  /* ---------- 확인 완료 바 ---------- */
  .done-bar{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    border:1px solid var(--hairline); border-radius:var(--r-sm); padding:14px 18px; margin-bottom:14px;
  }
  .done-bar.is-done{ background:var(--done-wash-soft); border-color:#c2e9eb; }
  .btn-done{
    appearance:none; font-family:"JetBrains Mono",monospace; font-size:13px; font-weight:500;
    letter-spacing:0.04em; text-transform:uppercase; cursor:pointer;
    background:var(--ink); color:var(--on-primary); border:1px solid var(--ink);
    border-radius:var(--r-sm); padding:10px 22px;
  }
  .btn-done:hover{ background:#1d1d2e; }
  .btn-done:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .btn-done[disabled]{ background:var(--done-wash); color:var(--done); border-color:#a9e9ec; cursor:default; }
  .btn-link{
    appearance:none; background:none; border:none; cursor:pointer; padding:0;
    font-family:inherit; color:var(--body); text-decoration:underline; text-underline-offset:2px;
  }
  .btn-link:hover{ color:var(--ink); }
  .btn-link:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  .rest-link{ display:flex; align-items:center; gap:8px; color:var(--body); }
  .rest-link button{ color:var(--ink); }

  .empty{ border:1px dashed var(--hairline); border-radius:var(--r-sm); padding:18px; color:var(--body); }

  /* ---------- 전체 피드 / 카테고리별 / 아카이브 ---------- */
  /* 피드 레이아웃은 별도 작업에서 다듬어진 것을 그대로 가져왔다. 1120px 컨테이너에서
     740px로 묶여 있던 목록을 폭에 맞춰 펴고, 1열 구간에서는 요약이 폭을 다 쓰도록
     출처 배지를 오른쪽 레일로 보낸다. */
  .feed-controls{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  #feed-q{ flex:1 1 260px; max-width:420px; font-family:inherit; font-size:15px; line-height:20px; color:var(--ink); background:var(--canvas);
    padding:10px 14px; border:1px solid var(--hairline); border-radius:var(--r-sm); }
  #feed-q::placeholder{ color:var(--body); }
  #feed-q:focus{ outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink); }
  #feed-view .list{ display:grid; grid-template-columns:minmax(0,1fr); gap:12px; align-items:start; }
  #feed-view .list > p, #feed-view .list > button{ grid-column:1 / -1; }
  @media (min-width:940px){
    #feed-view .list{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  }
  /* 1열이지만 카드가 넓어지는 구간: 출처·매체 배지를 오른쪽 레일로 보내 폭을 쓴다 */
  @media (min-width:761px) and (max-width:939px){
    #feed-view .card{ display:grid; grid-template-columns:minmax(0,1fr) 190px; column-gap:24px; }
    #feed-view .card .row-top{ grid-column:1; grid-row:1; }
    #feed-view .card h3{ grid-column:1; grid-row:2; }
    #feed-view .card p{ grid-column:1; grid-row:3; margin-bottom:0; max-width:none; }
    #feed-view .card .row-meta{ grid-column:2; grid-row:1 / span 3; flex-direction:column; align-items:flex-end; justify-content:flex-start; gap:8px; }
    #feed-view .card .sources{ justify-content:flex-end; }
  }
  .filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; align-items:center; }
  .cat-pill{ appearance:none; cursor:pointer; border:1px solid var(--hairline); background:var(--canvas); color:var(--ink); border-radius:var(--r-sm); padding:7px 14px; display:inline-flex; align-items:center; gap:7px; font-family:inherit; }
  .cat-pill .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }
  .cat-pill:hover{ border-color:var(--ink); }
  .cat-pill:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .cat-pill.geo{ color:var(--cat-geo); }
  .cat-pill.ai{ color:var(--cat-ai); }
  .cat-pill.industry{ color:var(--cat-industry); }
  .cat-pill.perf{ color:var(--cat-perf); }
  .cat-pill.commerce{ color:var(--cat-commerce); }
  .cat-pill.brand{ color:var(--cat-brand); }
  .cat-pill.research{ color:var(--cat-research); }
  .cat-pill.active{ border-color:currentColor; }
  .cat-pill.active.geo{ background:var(--cat-geo-wash); }
  .cat-pill.active.ai{ background:var(--cat-ai-wash); }
  .cat-pill.active.industry{ background:var(--cat-industry-wash); }
  .cat-pill.active.perf{ background:var(--cat-perf-wash); }
  .cat-pill.active.commerce{ background:var(--cat-commerce-wash); }
  .cat-pill.active.brand{ background:var(--cat-brand-wash); }
  .cat-pill.active.research{ background:var(--cat-research-wash); }
  .cat-pill.active.all{ background:var(--ink); color:var(--on-primary); border-color:var(--ink); }
  .cat-pill.active.all .dot{ display:none; }

  #feed-filters{ margin-bottom:8px; }
  .filter-note{ margin:0 0 18px; max-width:70ch; }
  /* ---------- 카테고리별: 분야별 브리핑 → 상세 목록 ---------- */
  .cb-intro{ margin:0 0 6px; color:var(--body); }
  .cb-block{ border-top:1px solid var(--hairline); padding:18px 0 14px; }
  .cb-block:last-child{ border-bottom:1px solid var(--hairline); }
  .cb-head{ display:flex; align-items:baseline; gap:4px 12px; flex-wrap:wrap; }
  .cb-name{ font-size:18px; font-weight:500; line-height:24px; letter-spacing:-0.2px; color:var(--ink); display:inline-flex; align-items:center; gap:8px; }
  /* 분야명은 분야 전환 칩과 같은 분야 색(점 + 글자)으로 구분한다. */
  .cb-name .dot{ width:8px; height:8px; border-radius:50%; background:currentColor; flex:none; }
  .cb-name.geo{ color:var(--cat-geo); }
  .cb-name.ai{ color:var(--cat-ai); }
  .cb-name.industry{ color:var(--cat-industry); }
  .cb-name.perf{ color:var(--cat-perf); }
  .cb-name.commerce{ color:var(--cat-commerce); }
  .cb-name.brand{ color:var(--cat-brand); }
  .cb-name.research{ color:var(--cat-research); }
  .cb-count{ color:var(--body); font-variant-numeric:tabular-nums; }
  .cb-count b{ font-weight:500; color:var(--ink); }
  .cb-def{ margin:2px 0 10px; color:var(--body); }
  .cb-rows{ display:flex; flex-direction:column; }
  .cb-row{ display:flex; align-items:baseline; gap:10px; padding:7px 0; }
  .cb-row + .cb-row{ border-top:1px dashed var(--hairline); }
  .cb-row .cb-title{ flex:1; min-width:0; font-size:15px; line-height:21px; color:var(--ink); }
  .cb-row a.cb-title:hover{ text-decoration:underline; text-underline-offset:3px; }
  .cb-meta{ flex:none; color:var(--body); white-space:nowrap; }
  .cb-tier{ flex:none; font-size:12px; line-height:16px; padding:1px 7px; border-radius:var(--r-sm); border:1px solid transparent; }
  .cb-tier.action{ background:var(--action-wash); color:var(--action); border-color:#f0cdbc; }
  .cb-tier.heads_up{ background:var(--headsup-wash); color:var(--headsup); border-color:#eadfbe; }
  .cb-empty{ color:var(--body); padding:4px 0 2px; }
  .cb-link{ appearance:none; background:none; border:none; padding:0; margin-top:6px; font:inherit; font-size:14px; color:var(--ink); cursor:pointer; text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--hairline); }
  .cb-link:hover{ text-decoration-color:var(--ink); }
  .cb-link:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .cb-block.folded{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .cb-block.folded .cb-link{ margin-top:0; }
  /* 좁은 화면에서는 출처·날짜를 제목 옆이 아니라 아래로 내린다. 옆에 두면 제목이 한 단어씩 깨진다. */
  @media (max-width:680px){
    .cb-row{ display:block; }
    .cb-row .cb-tier{ display:inline-block; margin-right:6px; }
    .cb-row .cb-meta{ display:block; margin-top:2px; white-space:normal; }
  }

  .cd-back{ margin:0 0 14px; }
  .cd-switch{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 20px; }
  /* 분야 전환 칩: 예전 카테고리 필터처럼 분야 색(점 + 글자)으로 구분하고, 선택된 분야는 같은 색의 옅은 바탕을 깐다. */
  .cd-switch button{ appearance:none; font:inherit; font-size:14px; font-weight:500; cursor:pointer; border:1px solid var(--hairline); background:var(--canvas); color:var(--ink); border-radius:var(--r-sm); padding:6px 12px; display:inline-flex; align-items:center; gap:7px; }
  .cd-switch button .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }
  .cd-switch button:hover{ border-color:currentColor; }
  .cd-switch button:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .cd-switch button.geo{ color:var(--cat-geo); }
  .cd-switch button.ai{ color:var(--cat-ai); }
  .cd-switch button.industry{ color:var(--cat-industry); }
  .cd-switch button.perf{ color:var(--cat-perf); }
  .cd-switch button.commerce{ color:var(--cat-commerce); }
  .cd-switch button.brand{ color:var(--cat-brand); }
  .cd-switch button.research{ color:var(--cat-research); }
  .cd-switch button.active{ border-color:currentColor; }
  .cd-switch button.active.geo{ background:var(--cat-geo-wash); }

tier": "context", "is_official": false}, {"category": "Data & AI Research", "date": "2026-08-27", "time": "04:31", "first_seen_at": "2026-08-27T04:31:50+00:00", "title": "이용석 스노우플레이크 지사장 “한국, 가파른 성장 계속…AI, 실험 아닌 성과 내는 워크로드로”", "summary": "“AI 프로젝트가 개념검증(PoC) 단계에 머무르지 않고 실제 운영 환경으로 빠르게 전환하도록 지원해, AI를 지금 성과를 내는 워크로드로 만들겠습니다.\" 이용석 스노우플레이크 신임 한국지사장은 27일 서울 코엑스에서 열린 연례 컨퍼런스 ‘스노우플레이크 월드 투어 서울’ 행사에 나와 이같이 말하고 “대한민국을 대표하는 기업들과 함께 쌓아온 신뢰를 바탕으로 앞으로 더 많은 기업들이 AI 비즈니스 성과를 만들어 갈 수 있도록 계속 노력하겠다”는 포부를 밝혔다.", "sources": [{"name": "바이라인네트워크", "url": "https://byline.network/2026/08/27-667/", "official": false}], "platforms": [], "action_tier": "context", "is_official": false}, {"category": "Marketing Industry", "date": "2026-08-27", "time": "04:54", "first_seen_at": "2026-08-27T04:54:56+00:00", "title": "틱톡 “2030년 K컬처 경제효과 40조원, 틱톡이 견인”", "summary": "K-컬처 콘텐츠 글로벌 유통 플랫폼으로 부상한 틱톡이 오는 2030년까지 한국에 가져올 경제적 효과가 약 40조원에 이르는 것으로 나타났다. 발견-신뢰-참여로 이어지는 틱톡의 콘텐츠 유통 구조가 K-컬처의 성장에 유의미한 영향을 미친다는 분석이다.", "sources": [{"name": "바이라인네트워크", "url": "https://byline.network/2026/08/26_3982737/", "official": false}], "platforms": [{"id": "P014", "label": "TikTok", "company": "TikTok"}], "action_tier": "context", "is_official": false}, {"category": "Data & AI Research", "date": "2026-08-27", "time": "13:34", "first_seen_at": "2026-08-27T05:06:16+00:00", "title": "독파모 5개 정예팀, AI 학습 데이터 3544만건 공개…1조5600억토큰 규모", "summary": "과학기술정보통신부(과기정통부)와 한국지능정보사회진흥원(NIA)은 27일 독자 인공지능(AI) 파운데이션 모델(독파모) 프로젝트에 참여한 5개 정예팀(네이버클라우드·업스테이지·SK텔레콤·엔씨에이아이·LG AI연구원)이 구축한 AI 학습용 데이터 29종을 공개했다.", "sources": [{"name": "바이라인네트워크", "url": "https://byline.network/2026/08/0827-5/", "official": false}], "platforms": [], "action_tier": "context", "is_official": false}, {"category": "Data & AI Research", "date": "2026-08-27", "time": "06:00", "first_seen_at": "2026-08-27T06:00:46+00:00", "title": "스노우플레이크가 말하는, AI 시대 ‘에이전틱 엔터프라이즈’ 만드는 방법", "summary": "“현재 많은 사람들은 AI 에이전트를 배포하면 에이전트가 데이터를 분석해 필요한 정보와 원하는 답을 얻을 수 있을 것이라고 잘못 생각하고 있다. 기업은 현재 다양한 애플리케이션, 다양한 데이터 형식과 데이터베이스 같은 파편화된 엔터프라이즈 아키텍처를 보유하고 있다. 이같은 환경에서 AI가 안정적으로 작동하는 방법을 찾은 것은 매우 어려운 과제다.” 스노우플레이크는 27일 서울 코엑스에서 열린 ‘스노우플레이크 월드 투어 서울’ 행사에서 기업이 이같은 문제를 해결해 에이전틱 엔터프라이즈 환경을 구현할 수 있는 핵심 방안을 소개했다.", "sources": [{"name": "바이라인네트워크", "url": "https://byline.network/2026/08/27-675/", "official": false}], "platforms": [], "action_tier": "context", "is_official": false}, {"category": "Data & AI Research", "date": "2026-08-27", "time": "06:05", "first_seen_at": "2026-08-27T06:05:28+00:00", "title": "정체불명 AI ‘옥스 알파’, 중국의 Z.ai였다", "summary": "지난주 AI 업계를 뒤흔든 정체불명의 AI 모델 ‘옥스 알파(Ox Alpha)’의 정체가 밝혀졌다. 중국 베이징의 AI 스타트업 Z.ai(즈푸AI)였다. Z.ai는 26일(현지시각) 옥스 알파가 자사 GLM 시리즈의 신형 모델이라고 공식 확인했다. 모델명은 GLM-5.3-플래시다.", "sources": [{"name": "바이라인네트워크", "url": "https://byline.network/2026/08/z-ai/", "official": false}], "platforms": [], "action_tier": "context", "is_official": false}, {"category": "Marketing Industry", "date": "2026-08-27", "time": "07:35", "first_seen_at": "2026-08-27T07:35:27+00:00", "title": "“미 청소년 인스타·페북 하루 2시간까지”…메타, 51개주와 합의", "summary": "메타가 청소년 SNS 중독 소송에서 51개 주정부와 합의를 이뤘다. 향후 10년간 최대 180억달러(약 24조9000억원)를 지급하고, 페이스북과 인스타그램의 청소년 이용 방식도 대폭 제한하기로 했다.", "sources": [{"name": "바이라인네트워크", "url": "https://byline.network/2026/08/meta-5/", "official": false}], "platforms": [{"id": "P006", "label": "Instagram", "company": "Meta"}, {"id": "P007", "label": "Facebook", "company": "Meta"}], "action_tier": "context", "is_official": false}, {"category": "AI Trends", "date": "2026-08-27", "time": "08:02", "first_seen_at": "2026-08-27T08:02:56+00:00", "title": "이노그리드, 전 직원에 ‘클로드’ 도입…3개월간 AI 생산성 검증", "summary": "이노그리드는 전 직원을 대상으로 생성형 인공지능(AI) 업무도구 클로드(Claude) 라이선스를 지원하고 약 3개월간 대표 업무 과제 3건의 생산성 개선 효과를 검증한 뒤 오는 11월 대표이사 성과 리뷰에서 AI 활용 성과와 투자 대비 효과(ROI)를 평가한다고 27일 밝혔다.", "sources": [{"name": "바이라인네트워크", "url": "https://byline.network/2026/08/0827-7/", "official": false}], "platforms": [], "action_tier": "context", "is_official": false}, {"category": "Commerce & Retail", "date": "2026-08       btn.textContent = pending ? `오늘 확인 완료 (${pending}건)` : '오늘 확인 완료';
    }

    const storageWarn = storageOK ? ''
      : ' · <span>이 브라우저는 저장이 막혀 있어 새로고침하면 확인 기록이 사라집니다</span>';
    note.innerHTML = (checkedAt
      ? `마지막 확인 ${fmtStamp(checkedAt)} · <button class="btn-link" id="btn-reset">지난 항목 다시 보기</button>`
      : `<span>확인을 완료하면 다음 방문 때 새로 들어온 것만 보입니다.</span>`) + storageWarn;
    const reset = document.getElementById('btn-reset');
    if (reset) reset.addEventListener('click', () => { lsRemove(LS_LAST_CHECKED); renderToday(); });
  }

  function renderToday(){
    renderVerdict();
    renderStatusRow();
    renderTodayLists();
    renderDoneBar();
  }

  document.getElementById('btn-done').addEventListener('click', () => {
    if (document.getElementById('btn-done').disabled) return;
    lsSet(LS_LAST_CHECKED, new Date().toISOString());
    renderToday();
  });

  /* ---------- 전체 피드 ---------- */
  let feedTier = 'all';
  let rangeDays = 7;   // 기본은 최근 7일. 전체 368건을 한 번에 펼치면 훑을 수가 없다.
  let feedQuery = '';

  const LATEST_DATE = CLASSIFIED_EVENTS.reduce((m, e) => (e.date > m ? e.date : m), '');

  function cutoffDate(days){
    if (!days || !LATEST_DATE) return '';
    const base = new Date(LATEST_DATE + 'T00:00:00');
    base.setDate(base.getDate() - (days - 1));
    return `${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}-${String(base.getDate()).padStart(2,'0')}`;
  }
  function matchesQuery(ev){
    if (!feedQuery) return true;
    return (ev.title + ' ' + ev.summary + ' ' + ev.sources.map(s => s.name).join(' '))
      .toLowerCase().includes(feedQuery);
  }

  function feedCardHTML(ev){
    const tierBadge = ev.action_tier === 'context'
      ? ''
      : `<span class="badge mono-eyebrow badge-tier-${esc(ev.action_tier)}">${TIER_LABEL[ev.action_tier]}</span>`;
    return `<div class="card tier-${esc(ev.action_tier)}">
      <div class="row-top">
        <div class="tags">${tierBadge}${chipHTML(ev)}${platformBadgesHTML(ev)}</div>
        <span class="mono-caption">${fmtDateLabel(ev.date)} · ${esc(ev.time)}</span>
      </div>
      <h3><a href="${esc(primaryUrl(ev))}" target="_blank" rel="noopener">${esc(ev.title)}</a></h3>
      <p class="body-md">${esc(ev.summary)}</p>
      <div class="row-meta">
        <div class="sources">${sourcePillsHTML(ev)}</div>
        <span class="badge mono-caption">${countLabel(ev)}</span>
      </div>
    </div>`;
  }

  function renderFeed(){
    // 등급 칩의 건수는 검색어·기간을 적용한 뒤의 수여야 한다. 전체 코퍼스 기준으로
    // 세면 "조치 필요 1"을 눌렀는데 최근 7일에는 0건인 상황이 설명되지 않는다.
    const cutoff = cutoffDate(rangeDays);
    const scoped = CLASSIFIED_EVENTS.filter(ev => matchesQuery(ev) && (!cutoff || ev.date >= cutoff));

    const counts = {
      all: scoped.length,
      action: scoped.filter(e => e.action_tier === 'action').length,
      heads_up: scoped.filter(e => e.action_tier === 'heads_up').length,
      context: scoped.filter(e => e.action_tier === 'context').length,
    };
    const pill = (key, label) =>
      `<button class="cat-pill mono-btn${feedTier === key ? ' active all' : ''}" data-tier="${key}">${label} <span class="mono-caption" style="color:inherit">${counts[key]}</span></button>`;
    document.getElementById('feed-filters').innerHTML =
      pill('all','전체') + pill('action','조치 필요') + pill('heads_up','알아둘 것') + pill('context','참고');

    document.querySelectorAll('#feed-filters .cat-pill').forEach(btn => {
      btn.addEventListener('click', () => { feedTier = btn.dataset.tier; renderFeed(); });
    });

    const items = (feedTier === 'all' ? scoped : scoped.filter(e => e.action_tier === feedTier))
      .slice().sort(byRecency);

    const rangeLabel = rangeDays ? `최근 ${rangeDays}일` : '전체 기간';
    const queryLabel = feedQuery ? ` · “${feedQuery}” 검색` : '';
    const tierNote = feedTier === 'all' ? '' : ` — ${TIER_NOTE[feedTier]}`;
    document.getElementById('feed-note').textContent =
      `${rangeLabel}${queryLabel} · ${items.length}건${tierNote}`;

    if (items.length){
      document.getElementById('feed-list').innerHTML = items.map(feedCardHTML).join('');
      return;
    }

    // 기간 밖에 같은 조건의 소식이 있으면 범위를 넓힐 길을 준다. 빈 화면만 보여주면
    // 사용자는 데이터가 없는 건지 필터가 좁은 건지 알 수 없다.
    const sameTier = CLASSIFIED_EVENTS.filter(ev =>
      matchesQuery(ev) && (feedTier === 'all' || ev.action_tier === feedTier));
    const outside = sameTier.length - items.length;
    document.getElementById('feed-list').innerHTML =
      `<p class="body-md">${rangeLabel}에는 해당하는 소식이 없습니다.</p>` +
      (outside && rangeDays ? `<button class="cat-pill mono-btn all" id="feed-widen">전체 기간에서 ${outside}건 보기</button>` : '');
    const widen = document.getElementById('feed-widen');
    if (widen) widen.addEventListener('click', () => setRange(0));
  }

  function setRange(days){
    rangeDays = days;
    document.querySelectorAll('#range-filter button').forEach(b =>
      b.classList.toggle('active', Number(b.dataset.days) === days));
    renderFeed();
  }

  document.querySelectorAll('#range-filter button').forEach(b =>
    b.addEventListener('click', () => setRange(Number(b.dataset.days))));
  document.getElementById('feed-q').addEventListener('input', e => {
    feedQuery = e.target.value.trim().toLowerCase();
    renderFeed();
  });

  /* ---------- 카테고리별 ---------- */
  /* 카테고리별 탭은 "분야별로 요즘 무슨 흐름이 있나"를 보는 곳이다. 오늘 탭(조치),
     캘린더(날짜), 전체 피드(검색·정독)와 겹치지 않도록 기본 화면은 분야별 브리핑이고,
     분야를 고르면 요약이 붙은 목록으로 들어간다. 순서는 퍼포먼스 마케터 기준으로 고정해
     매일 같은 자리에서 찾게 한다. 데이터·AI 리서치는 전체의 약 40%인데 전부 참고
     등급이라, 펼치기 전에는 건수만 보인다. */
  const CATEGORY_VIEW_ORDER = ["Performance Marketing","SEO / GEO","AI Trends","Commerce & Retail","Brand Marketing","Marketing Industry","Data & AI Research"];
  const CATEGORY_FOLDED = "Data & AI Research";
  const CATEGORY_KO = {
    "Performance Marketing":"퍼포먼스 마케팅",
    "SEO / GEO":"SEO / GEO",
    "AI Trends":"AI 트렌드",
    "Commerce & Retail":"커머스·리테일",
    "Brand Marketing":"브랜드 마케팅",
    "Marketing Industry":"마케팅 업계",
    "Data & AI Research":"데이터·AI 리서치",
  };
  const CATEGORY_NOTE = {
    "Performance Marketing":"광고 플랫폼 운영·입찰·측정",
    "SEO / GEO":"검색 노출과 AI 검색 최적화",
    "AI Trends":"검색·광고에 들어오는 AI 기능과 도구",
    "Commerce & Retail":"이커머스·리테일 채널과 커머스 전략",
    "Brand Marketing":"브랜드 캠페인과 CMO 인사이트",
    "Marketing Industry":"플랫폼 기업·에이전시 등 업계 동향",
    "Data & AI Research":"데이터 사이언스·AI 연구. 실무 조치와는 거리가 먼 글",
  };
  const BRIEF_ROWS = 3;
  const TIER_RANK = { action:0, heads_up:1, context:2 };

  let activeCategory = null;     // null = 분야별 브리핑
  let foldedOpen = false;
  let olderOpen = false;

  function catName(cat){ return CATEGORY_KO[cat] || cat; }
  function relDay(d){
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((today - new Date(d + 'T00:00:00')) / 864e5);
    if (diff <= 0) return '오늘';
    if (diff === 1) return '어제';
    if (diff < 7) return `${diff}일 전`;
    return fmtDateLabel(d);
  }
  function catWindows(cat){
    const c7 = cutoffDate(7), c14 = cutoffDate(14);
    const all = CLASSIFIED_EVENTS.filter(e => e.category === cat).sort(byRecency);
    return {
      all,
      recent: all.filter(e => e.date >= c7),
      prev: all.filter(e => e.date >= c14 && e.date < c7),
      older: all.filter(e => e.date < c14),
    };
  }
  // 대표 헤드라인: 최근 14일 안에서 등급 → 최신 순. 비어 있으면 가장 최근 글.
  function briefPicks(w){
    const pool = w.recent.concat(w.prev);
    if (!pool.length) return w.all.slice(0, 2);
    return pool.slice().sort((a,b) =>
      (TIER_RANK[a.action_tier] - TIER_RANK[b.action_tier]) || byRecency(a,b)
    ).slice(0, BRIEF_ROWS);
  }
  // RSS 요약에 딸려 오는 HTML 태그와 "The post … appeared first on …" 꼬리말을 걷어낸다.
  function cleanSummary(s){
    return String(s || '')
      .replace(/<[^>]*>/g, ' ')
      .replace(/\s*The post .*?(?:appeared first|first appeared) on .*$/i, '')
      .replace(/\s+/g, ' ')
      .trim();
  }
  function tierTag(ev){
    return ev.action_tier === 'context' ? '' : `<span class="cb-tier ${esc(ev.action_tier)}">${TIER_LABEL[ev.action_tier]}</span>`;
  }
  function sourceLabel(ev){
    const s = ev.sources[0];
    if (!s) return '';
    return esc(s.name) + (s.official ? ' 공식' : '') + (ev.sources.length > 1 ? ` 외 ${ev.sources.length - 1}곳` : '');
  }
  function countLine(w){
    return `최근 7일 <b>${w.recent.length}건</b> · 직전 7일 ${w.prev.length}건`;
  }

  function briefBlockHTML(cat){
    const w = catWindows(cat);
    const picks = briefPicks(w);
    const rows = picks.length
      ? picks.map(ev => `<div class="cb-row">
          ${tierTag(ev)}
          <a class="cb-title" href="${esc(primaryUrl(ev))}" target="_blank" rel="noopener">${esc(ev.title)}</a>
          <span class="cb-meta caption">${sourceLabel(ev)} · ${relDay(ev.date)}</span>
        </div>`).join('')
      : `<div class="cb-empty caption">아직 들어온 글이 없습니다.</div>`;
    const stale = !w.recent.length && !w.prev.length && w.all.length
      ? `<div class="cb-empty caption">최근 14일 동안 새 글이 없어 가장 최근 글을 보여줍니다.</div>` : '';
    return `<section class="cb-block">
      <div class="cb-head">
        <span class="cb-name ${CATEGORY_KEY[cat] || 'industry'}"><span class="dot"></span>${esc(catName(cat))}</span>
        <span class="cb-count caption">${countLine(w)}</span>
      </div>
      <p class="cb-def caption">${esc(CATEGORY_NOTE[cat] || '')}</p>
      ${stale}
      <div class="cb-rows">${rows}</div>
      ${w.all.length ? `<button class="cb-link" data-open-cat="${esc(cat)}">${w.all.length}건 모두 보기 →</button>` : ''}
    </section>`;
  }

  function foldedBlockHTML(cat){
    const w = catWindows(cat);
    const allContext = w.recent.every(e => e.action_tier === 'context');
    return `<section class="cb-block folded">
      <div class="cb-head">
        <span class="cb-name ${CATEGORY_KEY[cat] || 'industry'}"><span class="dot"></span>${esc(catName(cat))}</span>
        <span class="cb-count caption">최근 7일 ${w.recent.length}건${w.recent.length && allContext ? ' · 전부 참고 등급' : ''}</span>
      </div>
      <button class="cb-link" data-unfold>펼치기</button>
    </section>`;
  }

  function renderCategoryBrief(){
    const cats = CATEGORY_VIEW_ORDER.filter(c => CLASSIFIED_EVENTS.some(e => e.category === c))
      .concat([...new Set(CLASSIFIED_EVENTS.map(e => e.category))].filter(c => !CATEGORY_VIEW_ORDER.includes(c)));
    const html = cats.map(cat =>
      cat === CATEGORY_FOLDED && !foldedOpen ? foldedBlockHTML(cat) : briefBlockHTML(cat)
    ).join('');
    document.getElementById('cat-body').innerHTML =
      `<p class="cb-intro caption">분야별 최근 흐름입니다. 건수는 최근 7일과 그 직전 7일을 비교하고, 대표 글은 등급·최신 순으로 골랐습니다.</p>${html}`;
  }

  function detailItemHTML(ev){
    const plats = ev.platforms.length ? ' · ' + ev.platforms.map(p => esc(p.label)).join(', ') : '';
    return `<article class="cd-item">
      <div class="cd-item-top">
        <h4><a href="${esc(primaryUrl(ev))}" target="_blank" rel="noopener">${esc(ev.title)}</a></h4>
        ${tierTag(ev)}
      </div>
      ${cleanSummary(ev.summary) ? `<p>${esc(cleanSummary(ev.summary))}</p>` : ''}
      <div class="cd-meta caption">${sourceLabel(ev)} · ${fmtDateLabel(ev.date)}${plats}</div>
    </article>`;
  }
  function detailGroupHTML(label, items, extra){
    return `<div class="cd-group">
      <div class="cd-group-head"><h3>${label}</h3><span class="caption">${items.length}건</span></div>
      ${items.length
        ? `<div class="cd-list">${items.map(detailItemHTML).join('')}</div>`
        : `<div class="cb-empty caption">이 기간에는 들어온 글이 없습니다.</div>`}
      ${extra || ''}
    </div>`;
  }

  function renderCategoryDetail(){
    const cat = activeCategory;
    const w = catWindows(cat);
    const cats = CATEGORY_VIEW_ORDER.filter(c => CLASSIFIED_EVENTS.some(e => e.category === c));
    const olderBlock = w.older.length
      ? (olderOpen
          ? detailGroupHTML('그 이전', w.older)
          : `<div class="cd-group"><button class="cb-link" data-older>그 이전 ${w.older.length}건 보기</button></div>`)
      : '';
    document.getElementById('cat-body').innerHTML = `
      <p class="cd-back"><button class="cb-link" data-back>← 분야별 브리핑</button></p>
      <div class="cd-switch" role="group" aria-label="분야 바꾸기">
        ${cats.map(c => `<button data-open-cat="${esc(c)}" class="${CATEGORY_KEY[c] || 'industry'}${c === cat ? ' active' : ''}"${c === cat ? ' aria-current="true"' : ''}><span class="dot"></span>${esc(catName(c))}</button>`).join('')}
      </div>
      <h2 class="disp-md cd-title">${esc(catName(cat))}</h2>
      <p class="caption" style="margin:0">${esc(CATEGORY_NOTE[cat] || '')} · 전체 ${w.all.length}건</p>
      ${detailGroupHTML('최근 7일', w.recent)}
      ${detailGroupHTML('8~14일 전', w.prev)}
      ${olderBlock}`;
  }

  function renderCategory(){
    if (activeCategory) renderCategoryDetail();
    else renderCategoryBrief();
  }

  document.getElementById('cat-body').addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t) return;
    const view = document.getElementById('category-view');
    if (t.dataset.openCat){
      activeCategory = t.dataset.openCat;
      olderOpen = false;
    } else if (t.hasAttribute('data-back')){
      activeCategory = null;
    } else if (t.hasAttribute('data-unfold')){
      foldedOpen = true;
    } else if (t.hasAttribute('data-older')){
      olderOpen = true;
      renderCategory();
      return;
    } else {
      return;
    }
    renderCategory();
    if (view.getBoundingClientRect().top < 0) view.scrollIntoView({ block:'start' });
  });

  /* ---------- 아카이브 ---------- */
  const eventsByDate = {};
  CLASSIFIED_EVENTS.forEach(ev => { (eventsByDate[ev.date] = eventsByDate[ev.date] || []).push(ev); });

  const allDates = Object.keys(eventsByDate).sort();
  let viewYear, viewMonth, selectedDate, minY, minM, maxY, maxM;
  if (allDates.length){
    [minY, minM] = allDates[0].split('-').map(Number);
    [maxY, maxM] = allDates[allDates.length-1].split('-').map(Number);
    viewYear = maxY; viewMonth = maxM - 1;
    selectedDate = allDates[allDates.length-1];
  } else {
    const now = new Date();
    viewYear = now.getFullYear(); viewMonth = now.getMonth();
    minY = maxY = viewYear; minM = maxM = viewMonth + 1;
    selectedDate = null;
  }

  function monthKey(y,m){ return y*12+m; }

  function renderCalendar(){
    document.getElementById('cal-label').textContent = `${viewYear}년 ${viewMonth+1}월`;
    document.getElementById('cal-prev').disabled = monthKey(viewYear,viewMonth) <= monthKey(minY, minM-1);
    document.getElementById('cal-next').disabled = monthKey(viewYear,viewMonth) >= monthKey(maxY, maxM-1);

    const grid = document.getElementById('cal-grid');
    const dowLabels = ['일','월','화','수','목','금','토'];
    let html = dowLabels.map(d => `<div class="cal-dow mono-caption">${d}</div>`).join('');

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

    for (let i=0; i<firstDay; i++) html += `<div class="cal-day empty"></div>`;
    for (let day=1; day<=daysInMonth; day++){
      const dateStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const items = eventsByDate[dateStr];
      const isSelected = dateStr === selectedDate;
      const countLabel = items ? `${String(items.length).padStart(2,'0')}건` : '';
      const aria = items ? `${viewMonth+1}월 ${day}일, 소식 ${items.length}건` : `${viewMonth+1}월 ${day}일, 소식 없음`;
      html += `<div class="cal-day body-md${items?' has-events':''}${isSelected?' selected':''}" data-date="${dateStr}" title="${aria}">
        ${day}${items ? `<span class="cnt">${countLabel}</span>` : ''}
      </div>`;
    }
    grid.innerHTML = html;

    grid.querySelectorAll('.cal-day.has-events').forEach(cell => {
      cell.addEventListener('click', () => {
        selectedDate = cell.dataset.date;
        renderCalendar();
        renderTimeline();
      });
    });
  }

  function renderDaySummary(date){
    const box = document.getElementById('day-summary');
    const summary = date ? DAILY_SUMMARIES[date] : '';
    box.hidden = !summary;
    // textContent로만 넣는다. LLM이 만든 문장을 HTML로 해석하지 않는다.
    document.getElementById('day-summary-text').textContent = summary || '';
  }

  function renderTimeline(){
    renderDaySummary(selectedDate);
    if (!selectedDate){
      document.getElementById('tl-date-label').textContent = '';
      document.getElementById('tl-count').textContent = '';
      document.getElementById('tl-list').innerHTML = `<div class="tl-more body-md">아직 분류된 소식이 없습니다. 수집은 됐지만 분류가 끝나지 않았을 수 있습니다.</div>`;
      document.getElementById('tl-sub').textContent = '';
      return;
    }
    const items = (eventsByDate[selectedDate] || []).slice().sort((a,b) => a.time.localeCompare(b.time));
    document.getElementById('tl-date-label').textContent = fmtDateLabel(selectedDate);
    document.getElementById('tl-count').textContent = items.length ? `${items.length}건` : '';

    const sub = document.getElementById('tl-sub');
    if (items.length){
      const tierCount = items.reduce((acc, ev) => { acc[ev.action_tier] = (acc[ev.action_tier]||0)+1; return acc; }, {});
      const parts = TIER_ORDER_VIEW
        .filter(t => tierCount[t])
        .map(t => `${TIER_LABEL[t]} ${tierCount[t]}건`);
      sub.textContent = `이날 분류된 소식 ${items.length}건 — ${parts.join(' · ')}. 시간은 마지막으로 보도된 시각입니다.`;
    } else {
      sub.textContent = '';
    }

    if (!items.length){
      document.getElementById('tl-list').innerHTML = `<div class="tl-more body-md">이 날짜에는 분류된 소식이 없습니다.</div>`;
      return;
    }

    document.getElementById('tl-list').innerHTML = items.map(ev => `
      <div class="tl-item">
        <span class="tl-time mono-caption">${esc(ev.time)}</span>
        <div class="tl-card">
          <div class="row-top">${chipHTML(ev)}${platformBadgesHTML(ev)}</div>
          <h4><a href="${esc(primaryUrl(ev))}" target="_blank" rel="noopener">${esc(ev.title)}</a></h4>
          <p class="body-md">${esc(ev.summary)}</p>
          <div class="row-meta">
            <div class="sources">${sourcePillsHTML(ev)}</div>
            <span class="badge mono-caption">${countLabel(ev)}</span>
          </div>
        </div>
      </div>`).join('');
  }

  document.getElementById('cal-prev').addEventListener('click', () => {
    viewMonth--; if (viewMonth < 0){ viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    viewMonth++; if (viewMonth > 11){ viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  /* ---------- 탭 ---------- */
  const tabButtons = document.querySelectorAll('.tabbar button');
  const views = {
    today: document.getElementById('today-view'),
    calendar: document.getElementById('calendar-view'),
    feed: document.getElementById('feed-view'),
    category: document.getElementById('category-view'),
  };
  function selectTab(target){
    tabButtons.forEach(b => {
      const on = b.dataset.target === target;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    Object.entries(views).forEach(([key, el]) => el.classList.toggle('active', key === target));
  }
  tabButtons.forEach(btn => btn.addEventListener('click', () => selectTab(btn.dataset.target)));

  /* ---------- 초기 렌더 ---------- */
  renderTopbar();
  renderToday();
  renderFeed();
  renderCategory();
  renderCalendar();
  renderTimeline();
</script>
</body>
</html>
